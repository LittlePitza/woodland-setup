<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle with warm parchment color -->
  <circle cx="16" cy="16" r="16" fill="#3D2B1F"/>

  <!-- Oak leaf silhouette -->
  <g fill="#C8A96E">
    <!-- Main trunk -->
    <rect x="15" y="22" width="2" height="7" rx="1"/>

    <!-- Leaf body - stylized oak -->
    <path d="
      M16 4
      C12 4 8 7 8 11
      C8 13 9 14.5 10 15.5
      C8.5 16 7 17.5 7 19.5
      C7 22 9.5 24 12 23.5
      C13 24 14 24 16 24
      C18 24 19 24 20 23.5
      C22.5 24 25 22 25 19.5
      C25 17.5 23.5 16 22 15.5
      C23 14.5 24 13 24 11
      C24 7 20 4 16 4
      Z
    " fill="#4A7C59"/>

    <!-- Leaf veins -->
    <line x1="16" y1="6" x2="16" y2="22" stroke="#3D6B4A" stroke-width="0.8" opacity="0.6"/>
    <line x1="16" y1="10" x2="10" y2="15" stroke="#3D6B4A" stroke-width="0.5" opacity="0.5"/>
    <line x1="16" y1="10" x2="22" y2="15" stroke="#3D6B4A" stroke-width="0.5" opacity="0.5"/>
    <line x1="16" y1="15" x2="11" y2="19" stroke="#3D6B4A" stroke-width="0.5" opacity="0.5"/>
    <line x1="16" y1="15" x2="21" y2="19" stroke="#3D6B4A" stroke-width="0.5" opacity="0.5"/>

    <!-- Small acorn on top -->
    <circle cx="16" cy="5.5" r="2.5" fill="#C8A96E"/>
    <rect x="13.5" y="3" width="5" height="2" rx="1" fill="#8B6914"/>
    <line x1="16" y1="3" x2="16" y2="2" stroke="#8B6914" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
